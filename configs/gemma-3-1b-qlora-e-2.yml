base_model: google/gemma-3-1b-it
model_type: Gemma3ForCausalLM

# gemma3 doesn't seem to play nice with ddp
ddp_find_unused_parameters: true

load_in_8bit: false
load_in_4bit: true

# huggingface repo
chat_template: gemma3
eot_tokens:
  - <end_of_turn>

datasets:
  - path: ./data/train.jsonl
    type: chat_template  # {"messages":[{"role":"system"|"user"|"assistant","content":...},...]}

val_set_size: 0.0
output_dir: ./outputs/gemma-3-1b-sql-qlora-e-2

adapter: qlora

# =========================
# L3 LoRA Experiment Config
# q,k,v,o + MLP (gate/up/down)
# =========================
lora_r: 32
lora_alpha: 16
lora_dropout: 0.1

# IMPORTANT:
# Turn off lora_target_linear since we want explicit targeting
lora_target_linear: false

# Explicit target modules for Gemma-like architectures
# (attention projections + mlp projections)
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

sequence_len: 2048
sample_packing: true
eval_sample_packing: false

wandb_project:
wandb_entity:
wandb_watch:
wandb_name:
wandb_log_model:

gradient_accumulation_steps: 4
micro_batch_size: 2
num_epochs: 4

optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0002

bf16: auto
tf32: true

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

resume_from_checkpoint:
logging_steps: 1
flash_attention: true

warmup_ratio: 0.1
evals_per_epoch:
saves_per_epoch: 1

weight_decay: 0.0

special_tokens:
  eos_token: "<end_of_turn>"
